<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expedición N°01 - Viña del Mar</title>
    
    <!-- Librerías externas -->
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #faf7f2; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* Marcador personalizado con nombre */
        .custom-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .marker-label {
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.18);
            border: 1px solid #e2d7cb;
            white-space: nowrap;
            margin-bottom: 4px;
            pointer-events: auto;
        }

        .marker-pin {
            width: 14px;
            height: 14px;
            background-color: #d56241;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Estilo de la tarjeta alineado al flyer */
        .info-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #ffffff; padding: 22px; border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; 
            width: 85%; max-width: 350px; z-index: 10; max-height: 80vh; overflow-y: auto;
            border-top: 5px solid #d56241;
        }

        .info-card h3 { 
            margin: 0 0 12px 0; 
            color: #1a1a1a; 
            font-size: 22px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .info-card p { margin: 6px 0; font-size: 14px; color: #444; line-height: 1.4; }
        .horario-texto { white-space: pre-line; color: #555; font-size: 13.5px; }
        
        .promo-box { 
            background-color: #fcf9f5; 
            border: 1px solid #f0e6da; 
            border-radius: 12px; 
            padding: 14px; 
            margin: 15px 0; 
        }

        .promo-box h4 { 
            margin: 0 0 8px 0; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            color: #d56241; 
            font-weight: 700;
            border-bottom: 1px solid #eadcd0; 
            padding-bottom: 4px; 
        }

        .promo-list { 
            margin: 0 0 12px 0; 
            padding-left: 18px; 
            font-size: 14px; 
            color: #333; 
        }
        .promo-list li { margin-bottom: 4px; }
        .promo-list:last-child { margin-bottom: 0; }

        .link-ig { 
            display: inline-block; 
            margin-bottom: 15px; 
            color: #d56241; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px; 
        }

        .btn-ruta { 
            display: block; 
            width: 100%; 
            padding: 13px 0; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .btn-cerrar { 
            position: absolute; top: 15px; right: 15px; 
            background: #f0f0f0; border: none; border-radius: 50%; 
            width: 28px; height: 28px; font-size: 13px; 
            cursor: pointer; color: #666; 
            display: flex; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ficha-local" class="info-card">
        <button class="btn-cerrar" onclick="cerrarFicha()">✖</button>
        <h3 id="local-nombre">Nombre</h3>
        <p id="local-direccion">📍 Dirección</p>
        <p id="local-horario" class="horario-texto">🕒 Horario</p>
        <div class="promo-box" id="local-promociones"></div>
        <a id="local-instagram" href="#" target="_blank" class="link-ig">📷 @instagram</a>
        <a id="local-ruta" href="#" target="_blank" class="btn-ruta">Ver ruta en mapa</a>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron', 
            center: [-71.5518, -33.0245], 
            zoom: 13.5,
            attributionControl: false
        });

        const urlGoogleSheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbQEnC3_gekcWplNN2K5w-gtLJVjJxFvnHyoA5JWhO2rDz6fVptdewIbbP3G6xaDjphai1vD8mpvQr/pub?output=csv";

        function obtenerValor(obj, palabrasClave) {
            const keys = Object.keys(obj);
            for (let key of keys) {
                const keyClean = key.toLowerCase().trim();
                for (let kw of palabrasClave) {
                    if (keyClean.includes(kw)) {
                        return obj[key];
                    }
                }
            }
            return "";
        }

        function formatearHorario(texto) {
            if (!texto) return '';
            let formateado = texto.replace(/(SÁBADO|SABADO|Sabado|Sáb)/g, '\nSÁBADO');
            formateado = formateado.replace(/;/g, '\n');
            return '🕒 ' + formateado.trim();
        }

        Papa.parse(urlGoogleSheetCSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const locales = results.data;
                
                locales.forEach(local => {
                    const latRaw = obtenerValor(local, ["latitud", "lat"]);
                    const lngRaw = obtenerValor(local, ["longitud", "lng", "lon"]);

                    if (!latRaw || !lngRaw) return;

                    const lat = parseFloat(latRaw.toString().replace(',', '.').trim());
                    const lng = parseFloat(lngRaw.toString().replace(',', '.').trim());

                    if (isNaN(lat) || isNaN(lng)) return;

                    const nombre = obtenerValor(local, ["nombre", "local"]) || 'Sin nombre';

                    // CREAR ELEMENTO PERSONALIZADO (ETIQUETA + PUNTO)
                    const el = document.createElement('div');
                    el.className = 'custom-marker';
                    el.innerHTML = `
                        <div class="marker-label">${nombre}</div>
                        <div class="marker-pin"></div>
                    `;

                    const marker = new maplibregl.Marker({ element: el })
                        .setLngLat([lng, lat])
                        .addTo(map);

                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        
                        const direccion = obtenerValor(local, ["direcci", "ubicaci"]) || '';
                        const horario = obtenerValor(local, ["horario"]) || '';
                        const rawBebestibles = obtenerValor(local, ["bebestible", "bebida"]);
                        const rawComidas = obtenerValor(local, ["comida", "alimento"]);
                        const rawInstagram = obtenerValor(local, ["instagram", "ig"]);

                        document.getElementById('local-nombre').innerText = nombre;
                        document.getElementById('local-direccion').innerText = '📍 ' + direccion;
                        document.getElementById('local-horario').innerText = formatearHorario(horario);
                        
                        const bebestibles = rawBebestibles ? rawBebestibles.split(';').map(item => item.trim()).filter(item => item !== "") : [];
                        const comidas = rawComidas ? rawComidas.split(';').map(item => item.trim()).filter(item => item !== "") : [];
                        
                        let htmlPromos = '';
                        if (bebestibles.length > 0) {
                            htmlPromos += '<h4>Bebestibles</h4><ul class="promo-list">';
                            bebestibles.forEach(item => { htmlPromos += `<li>${item}</li>`; });
                            htmlPromos += '</ul>';
                        }
                        if (comidas.length > 0) {
                            htmlPromos += '<h4>Comidas</h4><ul class="promo-list">';
                            comidas.forEach(item => { htmlPromos += `<li>${item}</li>`; });
                            htmlPromos += '</ul>';
                        }
                        
                        const promoContainer = document.getElementById('local-promociones');
                        if (htmlPromos === '') {
                            promoContainer.style.display = 'none';
                        } else {
                            promoContainer.style.display = 'block';
                            promoContainer.innerHTML = htmlPromos;
                        }
                        
                        const igLink = document.getElementById('local-instagram');
                        if (rawInstagram && rawInstagram.trim() !== "") {
                            let usuarioLimpio = rawInstagram.replace('@', '').trim();
                            igLink.href = 'https://instagram.com/' + usuarioLimpio;
                            igLink.innerText = '📷 @' + usuarioLimpio;
                            igLink.style.display = 'inline-block';
                        } else {
                            igLink.style.display = 'none';
                        }
                        
                        const urlMaps = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                        document.getElementById('local-ruta').href = urlMaps;
                        
                        document.getElementById('ficha-local').style.display = 'block';
                        map.flyTo({ center: [lng, lat], zoom: 15 });
                    });
                });
            }
        });

        function cerrarFicha() { document.getElementById('ficha-local').style.display = 'none'; }
        map.on('click', () => { cerrarFicha(); });
    </script>
</body>
</html>
</body>
</html>
