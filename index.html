<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expedición N°1 - Viña del Mar</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f4;}
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .info-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); display: none; 
            width: 85%; max-width: 350px; z-index: 10; max-height: 80vh; overflow-y: auto;
        }

        .info-card h3 { margin: 0 0 10px 0; color: #222; font-size: 22px; font-weight: bold; }
        .info-card p { margin: 5px 0; font-size: 14px; color: #555; }
        
        .promo-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 15px; margin: 15px 0; }
        .promo-box h4 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; color: #D9534F; border-bottom: 1px solid #ddd; padding-bottom: 4px; }

        .promo-list { margin: 0 0 12px 0; padding-left: 0; list-style-type: none; font-size: 14px; color: #333; }
        .promo-list li { margin-bottom: 6px; padding-left: 24px; position: relative; }
        .promo-list li::before { position: absolute; left: 0; }
        .list-bebida li::before { content: "☕"; }
        .list-comida li::before { content: "🥐"; }
        .promo-list:last-child { margin-bottom: 0; }

        .link-ig { display: inline-block; margin-bottom: 15px; color: #E1306C; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-ruta { display: block; width: 100%; padding: 12px 0; background-color: #222; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .btn-cerrar { position: absolute; top: 15px; right: 15px; background: #eee; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ficha-local" class="info-card">
        <button class="btn-cerrar" onclick="cerrarFicha()">✖</button>
        <h3 id="local-nombre">Nombre</h3>
        <p id="local-direccion">📍 Dirección</p>
        <p id="local-horario">🕒 Horario</p>
        <div class="promo-box" id="local-promociones"></div>
        <a id="local-instagram" href="#" target="_blank" class="link-ig">📷 @instagram</a>
        <a id="local-ruta" href="#" target="_blank" class="btn-ruta">🚶‍♂️ Ver ruta en mapa</a>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron', 
            center: [-71.5518, -33.0245], 
            zoom: 13,
            attributionControl: false
        });

        const urlGoogleSheetCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbQEnC3_gekcWplNN2K5w-gtLJVjJxFvnHyoA5JWhO2rDz6fVptdewIbbP3G6xaDjphai1vD8mpvQr/pub?output=csv";

        // Función de búsqueda flexible para encontrar la columna correcta
        function obtenerValor(obj, palabrasClave) {
            const keys = Object.keys(obj);
            for (let key of keys) {
                const keyClean = key.toLowerCase().trim();
                for (let kw of palabrasClave) {
                    if (keyClean.includes(kw)) {
                        return obj[key];
                    }
                }
            }
            return "";
        }

        Papa.parse(urlGoogleSheetCSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const locales = results.data;
                
                locales.forEach(local => {
                    const latRaw = obtenerValor(local, ["latitud", "lat"]);
                    const lngRaw = obtenerValor(local, ["longitud", "lng", "lon"]);

                    if (!latRaw || !lngRaw) return;

                    const lat = parseFloat(latRaw.toString().replace(',', '.').trim());
                    const lng = parseFloat(lngRaw.toString().replace(',', '.').trim());

                    if (isNaN(lat) || isNaN(lng)) return;

                    const marker = new maplibregl.Marker({ color: "#D9534F" })
                        .setLngLat([lng, lat])
                        .addTo(map);

                    marker.getElement().addEventListener('click', (e) => {
                        e.stopPropagation();
                        
                        const nombre = obtenerValor(local, ["nombre", "local"]) || 'Sin nombre';
                        const direccion = obtenerValor(local, ["direcci", "ubicaci"]) || '';
                        const horario = obtenerValor(local, ["horario"]) || '';
                        const rawBebestibles = obtenerValor(local, ["bebestible", "bebida"]);
                        const rawComidas = obtenerValor(local, ["comida", "alimento"]);
                        const rawInstagram = obtenerValor(local, ["instagram", "ig"]);

                        document.getElementById('local-nombre').innerText = nombre;
                        document.getElementById('local-direccion').innerText = '📍 ' + direccion;
                        document.getElementById('local-horario').innerText = '🕒 ' + horario;
                        
                        const bebestibles = rawBebestibles ? rawBebestibles.split(';').map(item => item.trim()).filter(item => item !== "") : [];
                        const comidas = rawComidas ? rawComidas.split(';').map(item => item.trim()).filter(item => item !== "") : [];
                        
                        let htmlPromos = '';
                        if (bebestibles.length > 0) {
                            htmlPromos += '<h4>Bebestibles</h4><ul class="promo-list list-bebida">';
                            bebestibles.forEach(item => { htmlPromos += `<li>${item}</li>`; });
                            htmlPromos += '</ul>';
                        }
                        if (comidas.length > 0) {
                            htmlPromos += '<h4>Comida</h4><ul class="promo-list list-comida">';
                            comidas.forEach(item => { htmlPromos += `<li>${item}</li>`; });
                            htmlPromos += '</ul>';
                        }
                        
                        const promoContainer = document.getElementById('local-promociones');
                        if (htmlPromos === '') {
                            promoContainer.style.display = 'none';
                        } else {
                            promoContainer.style.display = 'block';
                            promoContainer.innerHTML = htmlPromos;
                        }
                        
                        const igLink = document.getElementById('local-instagram');
                        if (rawInstagram && rawInstagram.trim() !== "") {
                            let usuarioLimpio = rawInstagram.replace('@', '').trim();
                            igLink.href = 'https://instagram.com/' + usuarioLimpio;
                            igLink.innerText = '📷 @' + usuarioLimpio;
                            igLink.style.display = 'inline-block';
                        } else {
                            igLink.style.display = 'none';
                        }
                        
                        const urlMaps = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
                        document.getElementById('local-ruta').href = urlMaps;
                        
                        document.getElementById('ficha-local').style.display = 'block';
                        map.flyTo({ center: [lng, lat], zoom: 15 });
                    });
                });
            }
        });

        function cerrarFicha() { document.getElementById('ficha-local').style.display = 'none'; }
        map.on('click', () => { cerrarFicha(); });
    </script>
</body>
</html>
